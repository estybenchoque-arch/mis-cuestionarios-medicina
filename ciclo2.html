<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma de Estudio Médico</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f4f7f6;
            color: #333;
            text-align: center;
        }
        h1 { color: #1a365d; }
        .grid-ciclos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .btn-ciclo {
            background: white;
            padding: 30px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.08);
            text-decoration: none;
            color: #2b6cb0;
            font-weight: bold;
            font-size: 1.3rem;
            border: 2px solid #e2e8f0;
            transition: 0.2s;
        }
        .btn-ciclo:hover {
            transform: translateY(-4px);
            border-color: #2b6cb0;
            background-color: #ebf8ff;
        }
    </style>
</head>
<body>

    <h1>🧠 Plataforma de Estudio Médico</h1>
    <p>Selecciona tu ciclo académico:</p>

    <div class="grid-ciclos">
        <a href="ciclo1.html" class="btn-ciclo">📚 Ciclo 1</a>
        <a href="ciclo2.html" class="btn-ciclo">🩺 Ciclo 2</a>
    </div>

</body>
</html>

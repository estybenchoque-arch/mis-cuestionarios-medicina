<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exámenes de Práctica - Sistema Reproductor</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
            background-color: #f8fafc;
            color: #2d3748;
            text-align: center;
        }
        .btn-volver {
            display: inline-block;
            background-color: #4a5568;
            color: white;
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 6px;
            float: left;
            font-size: 0.9rem;
        }
        .grid-examenes {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 40px;
            clear: both;
        }
        .card-examen {
            background: white;
            padding: 30px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.06);
            border: 2px solid #e2e8f0;
            border-top: 6px solid #319795;
            text-decoration: none;
            color: #2d3748;
            font-size: 1.2rem;
            font-weight: bold;
            transition: all 0.2s ease;
        }
        .card-examen:hover {
            transform: translateY(-4px);
            border-color: #319795;
            background-color: #e6fffa;
        }
        .card-extra {
            border-top-color: #e53e3e;
        }
        .card-extra:hover {
            border-color: #e53e3e;
            background-color: #fff5f5;
        }
    </style>
</head>
<body>

    <a href="../reproductor.html" class="btn-volver">⬅️ Volver a Reproductor</a>
    
    <h1 style="margin-top: 20px;">🔬 PRÁCTICA: Selecciona tu Examen</h1>

    <div class="grid-examenes">
        <!-- BOTÓN 1 -->
        <a href="examen1.html" class="card-examen">
            🧪 Examen 1
        </a>

        <!-- BOTÓN 2 -->
        <a href="examen2.html" class="card-examen">
            🧪 Examen 2
        </a>

        <!-- BOTÓN 3 -->
        <a href="extraordinario.html" class="card-examen card-extra">
            🚨 Examen Extraordinario
        </a>
    </div>

</body>
</html>

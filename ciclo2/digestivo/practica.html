<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica - Sistema Digestivo</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 30px auto; padding: 20px; background-color: #f8fafc; color: #2d3748; text-align: center; }
        .btn-volver { display: inline-block; background-color: #4a5568; color: white; text-decoration: none; padding: 8px 14px; border-radius: 6px; float: left; font-size: 0.9rem; }
        .header-titulo { clear: both; padding-top: 15px; }
        .grid-examenes { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-top: 35px; }
        .card-examen { background: white; padding: 30px 20px; border-radius: 12px; box-shadow: 0 4px 8px rgba(0,0,0,0.06); border: 2px solid #e2e8f0; border-top: 6px solid #319795; text-decoration: none; color: #2d3748; font-weight: bold; transition: all 0.2s ease; }
        .card-examen:hover { transform: translateY(-4px); border-color: #319795; background-color: #e6fffa; }
        .card-extra { border-top-color: #e53e3e; }
        .card-extra:hover { border-color: #e53e3e; background-color: #fff5f5; }
    </style>
</head>
<body>
    <a href="digestivo.html" class="btn-volver">⬅️ Volver a Digestivo</a>
    <div class="header-titulo">
        <h1>🔬 SECCIÓN DE PRÁCTICA</h1>
        <p>Selecciona tu evaluación práctica</p>
    </div>
    <div class="grid-examenes">
        <a href="examen1.html" class="card-examen">🧪 Examen 1</a>
        <a href="examen2.html" class="card-examen">🧪 Examen 2</a>
        <a href="extraordinario.html" class="card-examen card-extra">🚨 Examen Extraordinario</a>
    </div>
</body>
</html>
